[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "suiroai"
version = "0.1.0"
description = "SuiroAI single-case retail restocking MVP application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "streamlit>=1.55,<2"]

[dependency-groups]
dev = ["pytest>=9,<10", "langchain-core>=1,<2"]
browser = ["playwright>=1.51,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/suiroai"]
